<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESURGIR</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c09; --panel: #0f120d; --panel2: #141a11;
      --line: #2a3525; --line2: #3a4a30; --text: #c8d4b8;
      --muted: #6b7a5e; --dim: #3d4a33;
      --ok: #4a8a35; --ok-bright: #72c44e; --ok-glow: rgba(74,138,53,0.25);
      --amber: #b87c2a; --amber-bright: #e8a83e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Share Tech Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at center, rgba(114,196,78,0.10), transparent 45%),
        repeating-linear-gradient(0deg, rgba(0,20,0,0.06) 0px, rgba(0,20,0,0.06) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
    }
    .wrap {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .logo {
      width: min(90vw, 560px);
      height: auto;
      display: block;
      filter: drop-shadow(0 0 24px rgba(74,138,53,0.20));
    }
    .tagline {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: -10px;
    }
    .panel {
      width: min(92vw, 520px);
      background: linear-gradient(180deg, rgba(15,18,13,0.95), rgba(20,26,17,0.95));
      border: 1px solid var(--line);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }
    .panel::after {
      content: '';
      position: absolute; bottom: 0; right: 0;
      width: 18px; height: 18px;
      background: var(--bg);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .panel-title {
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ok-bright);
      margin-bottom: 12px;
    }
    .panel-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 16px;
    }
    .start-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      padding: 14px 20px;
      border: 1px solid var(--ok);
      color: var(--ok-bright);
      background: rgba(74,138,53,0.08);
      text-decoration: none;
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: all 0.18s ease;
      box-shadow: 0 0 0 0 var(--ok-glow);
    }
    .start-btn:hover {
      transform: translateY(-2px);
      border-color: var(--ok-bright);
      background: rgba(74,138,53,0.14);
      box-shadow: 0 0 18px 0 var(--ok-glow);
    }
    .sub-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .sub-links a {
      font-size: 10px;
      color: var(--dim);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 8px 10px;
      transition: all 0.15s;
    }
    .sub-links a:hover {
      color: var(--amber-bright);
      border-color: var(--amber);
      background: rgba(184,124,42,0.05);
    }
    .footer {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.10em;
    }
    @media (max-width: 640px){
      .start-btn { min-width: 100%; width: 100%; }
      .panel { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./pics/logo.png" alt="RESURGIR" />
    <div class="tagline">// Sistema de gestión de asentamiento post-apocalíptico</div>

    <div class="panel">
      <div class="panel-title">Acceso principal</div>
      <div class="panel-text">
        Lidera a tus supervivientes, gestiona recursos, afronta amenazas y mantén con vida el asentamiento un día más.
      </div>
      <a class="start-btn" href="resurgir.html">Iniciar partida</a>
    </div>

    <div class="sub-links">
      <a href="creator.html">Creator</a>
    </div>

    <div class="footer">Un juego diseñado por Vinx Rockatansky.</div>
  </div>
</body>
</html>
